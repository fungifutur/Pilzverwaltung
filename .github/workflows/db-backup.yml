name: DB-Backup nach Google Drive

on:
  schedule:
    - cron: '30 1 * * *'   # täglich 01:30 UTC = 02:30/03:30 Schweizer Zeit
  workflow_dispatch: {}     # manuell startbar (Actions → DB-Backup → Run workflow)

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: pg_dump (passend zur Render-Version) und rclone installieren
        env:
          PG_MAJOR: ${{ vars.PG_MAJOR || '16' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common rclone
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
          pg_dump --version

      - name: Dump erstellen und verschlüsseln
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: bash scripts/pg_backup.sh

      - name: Nach Google Drive hochladen und alte Backups löschen
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
          KEEP_DAYS: ${{ vars.BACKUP_KEEP_DAYS || '30' }}
        run: |
          rclone copy "${{ runner.temp }}/backups" gdrive:Pilzverwaltung-Backups --include 'pilzverwaltung_*.dump.gpg' -v
          rclone delete gdrive:Pilzverwaltung-Backups --min-age "${KEEP_DAYS}d" --include 'pilzverwaltung_*.dump.gpg' -v
          rclone ls gdrive:Pilzverwaltung-Backups | tail -5

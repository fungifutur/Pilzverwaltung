# Hinweis (Audit OPS-04): Diese Datei beschreibt die Konfiguration. Der laufende Service bei Render kann abweichen
# (Tarif, Name). Vor einem Blueprint-Sync mit dem Render-Dashboard vergleichen.
services:
  - type: web
    name: pilzverwaltung-v73
    runtime: node
    plan: free            # laut Auftraggeber läuft produktiv ein Bezahltarif; im Dashboard prüfen und hier anpassen
    # package-lock.json einchecken, dann reproduzierbar mit npm ci bauen
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_PASSWORD
        generateValue: true
      - key: RESCUE_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pilzverwaltung-db
          property: connectionString
      - key: WC_STORE_URL
        sync: false
      - key: WC_CONSUMER_KEY
        sync: false
      - key: WC_CONSUMER_SECRET
        sync: false
      - key: WC_WEBHOOK_SECRET
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false

databases:
  - name: pilzverwaltung-db
    plan: free            # laut Auftraggeber Bezahltarif; im Dashboard prüfen
